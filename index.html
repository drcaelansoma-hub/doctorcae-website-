<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dr. Caelan Soma – Clinical Psychologist</title>
  <meta name="description" content="Body-based, regulation-focused practice. Trauma and nervous system science translated into practical tools for parents, caregivers, and professionals." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f6f8;
      --primary: #3b6c94;
      --primary-soft: #7fa4c1;
      --brown: #a4744a;
      --text-main: #29333b;
      --text-muted: #6b7280;
      --card-bg: #ffffff;
      --border-subtle: #dde2e7;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #e6edf5 0, #f7f5f2 60%, #f4f1ec 100%);
      color: var(--text-main);
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.4rem 8vw 0.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-text-main {
      font-weight: 600;
      letter-spacing: 0.03em;
      font-size: 1.15rem;
      text-transform: uppercase;
      color: var(--primary);
    }

    .brand-text-sub {
      font-size: 1rem;
      color: var(--text-muted);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.4rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .nav-link { position: relative; padding-bottom: 0.1rem; }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--brown));
      transition: width 0.2s ease;
    }

    .nav-link:hover::after { width: 100%; }

    main { padding: 2.8rem 8vw 3rem; }

    .hero-title {
      font-size: clamp(2.1rem, 3vw + 1.2rem, 3rem);
      letter-spacing: -0.03em;
      margin-bottom: 0.9rem;
      max-width: 40rem;
    }

    .hero-subtitle {
      max-width: 32rem;
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 1.6rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .btn-primary {
      border-radius: 999px;
      padding: 0.8rem 1.5rem;
      font-size: 0.92rem;
      font-weight: 500;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, var(--primary), var(--brown));
      color: #ffffff;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18);
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 36px rgba(15, 23, 42, 0.2);
    }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      main { padding: 2rem 1.3rem 3rem; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="brand-text-main">Dr. Caelan Soma</div>
        <div class="brand-text-sub">Clinical Psychologist – Children, Adolescents, Parents and Professionals</div>
      </div>
      <nav>
        <a href="heldtoo/" class="nav-link">Held, Too.</a>
      </nav>
    </header>
    <main>
      <h1 class="hero-title">Body-based, regulation-focused practice.</h1>
      <p class="hero-subtitle">Trauma and nervous system science translated into practical tools for parents, caregivers, and professionals.</p>
      <div class="hero-actions">
        <a href="heldtoo/" class="btn-primary">Held, Too.</a>
      </div>
    </main>
  </div>
</body>
</html>
